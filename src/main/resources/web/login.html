<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#08121E">
    <title>Anmelden · __TITLE__</title>
    <style nonce="__NONCE__">
        :root {
            --bg: #08121E;
            --surface: #162233;
            --surface-2: #1D2C42;
            --primary: #4F8CFF;
            --danger: #EF4444;
            --success: #22C55E;
            --text: #F8FAFC;
            --muted: #94A3B8;
            --radius: 18px;
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: radial-gradient(circle at 20% 0%, #13233A 0%, var(--bg) 60%);
            color: var(--text);
            font-family: Inter, -apple-system, "Segoe UI", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: linear-gradient(145deg, rgba(30,41,59,.95), rgba(15,23,42,.95));
            border: 1px solid rgba(255,255,255,.06);
            border-radius: var(--radius);
            box-shadow: 0 20px 50px rgba(0,0,0,.45);
            padding: 32px 28px 28px;
        }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
        .brand .mark {
            width: 42px; height: 42px; border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), #A78BFA);
            display: grid; place-items: center; font-weight: 700; font-size: 20px;
        }
        .brand h1 { font-size: 20px; margin: 0; }
        .brand span { color: var(--muted); font-size: 13px; }
        h2 { font-size: 16px; font-weight: 600; margin: 0 0 16px; }
        label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
        input[type=text], input[type=password] {
            width: 100%; padding: 12px 14px; border-radius: 12px; font-size: 16px;
            border: 1px solid rgba(255,255,255,.1); background: var(--surface); color: var(--text); outline: none;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,140,255,.25); }
        .check { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 14px; color: var(--text); }
        .check input { width: 18px; height: 18px; accent-color: var(--primary); }
        button {
            width: 100%; margin-top: 22px; padding: 12px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600;
            background: var(--primary); color: white; cursor: pointer;
        }
        button:disabled { opacity: .6; cursor: default; }
        .message { min-height: 20px; margin-top: 14px; font-size: 14px; }
        .message.error { color: var(--danger); }
        .message.ok { color: var(--success); }
        .links { display: flex; justify-content: space-between; margin-top: 18px; font-size: 13px; }
        .links a { color: var(--muted); text-decoration: none; }
        .links a:hover { color: var(--text); }
        .hint { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 4px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<main class="card">
    <div class="brand">
        <div class="mark">M</div>
        <div><h1>__TITLE__</h1><span>Smarthome</span></div>
    </div>

    <form id="login" autocomplete="on">
        <h2>Anmelden</h2>
        <label for="login-user">Benutzername</label>
        <input id="login-user" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="login-password">Passwort</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <label class="check"><input id="login-remember" type="checkbox" checked> Angemeldet bleiben</label>
        <button type="submit">Anmelden</button>
        <div class="message" role="status"></div>
        <div class="links"><a href="#password">Passwort ändern</a><a href="#redeem">Code einlösen</a></div>
    </form>

    <form id="password" hidden>
        <h2>Passwort ändern</h2>
        <label for="pw-user">Benutzername</label>
        <input id="pw-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="pw-old">Aktuelles Passwort</label>
        <input id="pw-old" type="password" autocomplete="current-password" required>
        <label for="pw-new">Neues Passwort (mindestens 10 Zeichen)</label>
        <input id="pw-new" type="password" autocomplete="new-password" minlength="10" required>
        <label for="pw-repeat">Neues Passwort wiederholen</label>
        <input id="pw-repeat" type="password" autocomplete="new-password" minlength="10" required>
        <button type="submit">Passwort ändern</button>
        <div class="message" role="status"></div>
        <div class="links"><a href="#login">Zurück zur Anmeldung</a></div>
    </form>

    <form id="redeem" hidden>
        <h2>Code einlösen</h2>
        <p class="hint">Den Einrichtungscode erzeugt der Administrator auf dem STEM-Server. Damit legst du dein Passwort fest.</p>
        <label for="rd-user">Benutzername</label>
        <input id="rd-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <label for="rd-code">Code</label>
        <input id="rd-code" type="text" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX" required>
        <label for="rd-new">Neues Passwort (mindestens 10 Zeichen)</label>
        <input id="rd-new" type="password" autocomplete="new-password" minlength="10" required>
        <label for="rd-repeat">Neues Passwort wiederholen</label>
        <input id="rd-repeat" type="password" autocomplete="new-password" minlength="10" required>
        <button type="submit">Passwort festlegen</button>
        <div class="message" role="status"></div>
        <div class="links"><a href="#login">Zurück zur Anmeldung</a></div>
    </form>
</main>

<script nonce="__NONCE__">
(function () {
    "use strict";
    var forms = ["login", "password", "redeem"];

    /* only paths on this server, never another site (open redirect) */
    function target() {
        var next = new URLSearchParams(location.search).get("next") || "/";
        if (next.charAt(0) !== "/" || next.charAt(1) === "/" || next.charAt(1) === "\\" || next.indexOf(location.pathname) === 0) {
            return "/";
        }
        /* the browser keeps the #page of the original address across the redirect */
        var hash = location.hash.replace("#", "");
        if (hash && forms.indexOf(hash) < 0 && next.indexOf("#") < 0) {
            next += "#" + hash;
        }
        return next;
    }

    function show() {
        var name = location.hash.replace("#", "") || "login";
        if (forms.indexOf(name) < 0) {
            name = "login";
        }
        forms.forEach(function (id) {
            document.getElementById(id).hidden = id !== name;
        });
        var first = document.querySelector("#" + name + " input");
        if (first) {
            first.focus();
        }
    }

    function message(form, text, ok) {
        var box = form.querySelector(".message");
        box.textContent = text || "";
        box.className = "message " + (ok ? "ok" : "error");
    }

    function post(action, body) {
        return fetch("/auth/" + action, {
            method: "POST",
            credentials: "same-origin",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(body)
        }).then(function (response) {
            return response.json().catch(function () {
                return {ok: false, error: "Unerwartete Antwort (" + response.status + ")"};
            });
        }).catch(function () {
            return {ok: false, error: "Server nicht erreichbar"};
        });
    }

    function busy(form, value) {
        form.querySelector("button").disabled = value;
    }

    document.getElementById("login").addEventListener("submit", function (event) {
        event.preventDefault();
        var form = event.target;
        busy(form, true);
        message(form, "");
        post("login", {
            user: document.getElementById("login-user").value,
            password: document.getElementById("login-password").value,
            remember: document.getElementById("login-remember").checked
        }).then(function (result) {
            if (result.ok) {
                location.replace(target());
                return;
            }
            busy(form, false);
            message(form, result.error || "Anmeldung fehlgeschlagen");
            document.getElementById("login-password").select();
        });
    });

    document.getElementById("password").addEventListener("submit", function (event) {
        event.preventDefault();
        var form = event.target;
        if (document.getElementById("pw-new").value !== document.getElementById("pw-repeat").value) {
            message(form, "Die neuen Passwörter sind nicht gleich");
            return;
        }
        busy(form, true);
        post("password", {
            user: document.getElementById("pw-user").value,
            password: document.getElementById("pw-old").value,
            newPassword: document.getElementById("pw-new").value
        }).then(function (result) {
            busy(form, false);
            if (result.ok) {
                form.reset();
                message(form, "Passwort geändert. Andere Anmeldungen wurden abgemeldet.", true);
            } else {
                message(form, result.error || "Fehlgeschlagen");
            }
        });
    });

    document.getElementById("redeem").addEventListener("submit", function (event) {
        event.preventDefault();
        var form = event.target;
        if (document.getElementById("rd-new").value !== document.getElementById("rd-repeat").value) {
            message(form, "Die Passwörter sind nicht gleich");
            return;
        }
        busy(form, true);
        post("redeem", {
            user: document.getElementById("rd-user").value,
            code: document.getElementById("rd-code").value,
            newPassword: document.getElementById("rd-new").value
        }).then(function (result) {
            busy(form, false);
            if (result.ok) {
                var user = document.getElementById("rd-user").value;
                form.reset();
                location.hash = "#login";
                document.getElementById("login-user").value = user;
                message(document.getElementById("login"), "Passwort festgelegt, du kannst dich jetzt anmelden.", true);
                document.getElementById("login-password").focus();
            } else {
                message(form, result.error || "Fehlgeschlagen");
            }
        });
    });

    window.addEventListener("hashchange", show);
    show();

    /* already logged in: straight on */
    fetch("/auth/me", {credentials: "same-origin"}).then(function (response) {
        if (response.ok) {
            location.replace(target());
        }
    }).catch(function () {
    });
})();
</script>
</body>
</html>
